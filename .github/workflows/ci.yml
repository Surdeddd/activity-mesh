name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go mod download
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  hook-tests:
    name: hook regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install jq + generate en_US.UTF-8 locale
        run: |
          sudo apt-get update && sudo apt-get install -y jq locales
          sudo locale-gen en_US.UTF-8
      - name: run hook suite
        run: make test-hooks

  mcp-tests:
    name: mcp server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: run mcp suite
        run: make test-mcp

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint all bash scripts
        run: find . -name '*.sh' -not -path './.git/*' -not -path './bin/*' -print0 | xargs -0 shellcheck --severity=warning

  install-test:
    name: hermetic bootstrap install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: run install test
        run: make test-install

  archive-test:
    name: release archive contents
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true
      - name: run archive test
        run: make test-archives

  ps1-dry-run:
    name: bootstrap.ps1 dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dry-run windows installer
        shell: pwsh
        run: |
          ./installers/bootstrap.ps1 -DryRun
          ./installers/uninstall.ps1 -DryRun

  cross-build:
    name: cross-compile all binaries (no cgo)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: build all targets
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: activity-mesh-binaries
          path: bin/
          if-no-files-found: error
