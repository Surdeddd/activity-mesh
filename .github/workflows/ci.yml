name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go mod download
      # daemon + indexer require cgo + sqlite_fts5 build tag (mattn/go-sqlite3)
      - name: vet
        run: go vet -tags sqlite_fts5 ./...
        env:
          CGO_ENABLED: '1'
      - name: test
        run: go test -tags sqlite_fts5 -count=1 ./...
        env:
          CGO_ENABLED: '1'

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint all bash scripts
        run: find . -name '*.sh' -not -path './.git/*' -not -path './bin/*' -print0 | xargs -0 shellcheck --severity=warning

  cross-build-cli:
    name: cross-compile CLI (no cgo)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: build CLI for all targets
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: activity-log-cli-binaries
          path: bin/activity-log-*
          if-no-files-found: error

  build-daemon:
    name: build daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      # daemon requires cgo — must build natively per OS
      - name: build daemon native
        run: |
          mkdir -p bin
          OS_ID=$(go env GOOS)
          ARCH_ID=$(go env GOARCH)
          CGO_ENABLED=1 go build -tags sqlite_fts5 -trimpath \
            -o bin/activity-mesh-daemon-${OS_ID}-${ARCH_ID} ./server
      - uses: actions/upload-artifact@v4
        with:
          name: activity-mesh-daemon-${{ matrix.os }}
          path: bin/activity-mesh-daemon-*
          if-no-files-found: error
