name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go mod download
      # cgo-free everywhere: SQLite via modernc.org/sqlite (FTS5 compiled in)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...

  hook-tests:
    # ubuntu only: the hooks call jq, which macOS runners lack
    name: hook regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install jq + generate en_US.UTF-8 locale
        # The L3 router lowercases Cyrillic via `LC_ALL=en_US.UTF-8 tr` — that
        # locale ships on the macOS hosts this runs on but must be generated on
        # a minimal ubuntu runner, else Cyrillic intents silently mis-route.
        run: |
          sudo apt-get update && sudo apt-get install -y jq locales
          sudo locale-gen en_US.UTF-8
      - name: run hook suite
        run: make test-hooks

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint all bash scripts
        run: find . -name '*.sh' -not -path './.git/*' -not -path './bin/*' -print0 | xargs -0 shellcheck --severity=warning

  cross-build:
    name: cross-compile all binaries (no cgo)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: build all targets
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: activity-mesh-binaries
          path: bin/
          if-no-files-found: error
