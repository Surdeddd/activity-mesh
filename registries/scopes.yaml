# activity-mesh — scope registry (EXAMPLE)
#
# This file ships as a generic example. The live, personalised copy lives in
# the sync dir (~/Sync/activity/scopes.yaml) — the CLI, `refresh-caches`, and
# health/checks/schema-drift.sh all read that copy first and fall back to this
# one only as a seed. Edit the sync copy for your own scopes; keep this file
# generic so the public repo carries no private infrastructure.
#
# Scopes group events by domain. Status enum: active | deprecated | archived
#   active     — accept new emits, surface in queries
#   deprecated — accept new emits but warn, surface with a marker
#   archived   — reject new emits (CLI warns), still readable
#
# Convention: lowercase kebab-case; namespaced scopes use `:` (project:client-x).
#
# Optional `router: false` (default true) excludes a scope from the L3 router
# scopes-cache. Required when a scope name collides with an agent alias in
# agents.yaml — otherwise scope-intent and agent-intent double-filter to empty.
schema_version: 1

scopes:
  # ----- example project / product scopes (appear in the router cache) -----
  - name: demo-app
    description: "Example primary application scope"
    status: active
    created: 2026-01-01
  - name: infra
    description: "Example infrastructure / ops scope"
    status: active
    created: 2026-01-01
  - name: web
    description: "Example web frontend scope"
    status: active
    created: 2026-01-01
  - name: api
    description: "Example backend API scope"
    status: active
    created: 2026-01-01

  # ----- agent-overlap scopes -----
  # These names also exist as agent aliases in agents.yaml, so they must be
  # router: false (routed via agent intent instead — see the header note).
  - name: assistant
    description: "Example scope colliding with the 'assistant' agent alias"
    status: active
    created: 2026-01-01
    router: false
  - name: worker
    description: "Example scope colliding with the 'worker' agent alias"
    status: active
    created: 2026-01-01
    router: false

  # ----- meta scope (system-level self-events) -----
  - name: activity-mesh
    description: "Self-events from activity-mesh itself (heartbeat, compile, canary)"
    status: active
    created: 2026-01-01

  # ----- lifecycle-transition examples -----
  - name: legacy-service
    description: "Example deprecated scope, superseded by demo-app"
    status: deprecated
    created: 2026-01-01
    replaced_by: demo-app
  - name: project:client-x
    description: "Example time-bounded engagement scope, now archived"
    status: archived
    created: 2026-01-01
    expires: 2026-02-01
