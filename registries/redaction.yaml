# activity-mesh — tier-1 redaction regex pack (declarative)
#
# This file is the *canonical* declaration of redaction patterns. The Go
# package `pkg/redact` keeps a hand-written compiled copy for speed; this
# YAML is the source of truth for documentation, audits, and any other
# language binding (Python wiki-compiler, shell hooks, MCP server).
#
# Replacement form: [REDACTED:<type>:<len>] where {len} = original byte length.
# Audit log records SHA-256 first-12 hex of the original (truncatable).
#
# Order matters: longer/more specific patterns first to avoid sub-matches.
schema_version: 1

patterns:
  # ----- known credential formats -----
  - name: anthropic_key
    description: "Anthropic API/admin/oauth-app keys"
    kind: credential
    regex: 'sk-ant-(?:api03|admin01|oat01)-[A-Za-z0-9_\-]{93}AA'
    replacement: '[REDACTED:anthropic_key:{len}]'

  - name: openai_key
    description: "OpenAI legacy + project-scoped keys (left \\b guards against prose like risk-...)"
    kind: credential
    regex: '\bsk-(?:proj-)?[A-Za-z0-9_\-]{20,200}'
    replacement: '[REDACTED:openai_key:{len}]'

  - name: github_token
    description: "GitHub PATs, fine-grained, oauth (gho), user-to-server (ghu), refresh (ghr)"
    kind: credential
    regex: '\b(?:gh[posur]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})\b'
    replacement: '[REDACTED:github_token:{len}]'

  - name: gitlab_token
    description: "GitLab personal access tokens"
    kind: credential
    regex: '\bglpat-[A-Za-z0-9_\-]{20,}\b'
    replacement: '[REDACTED:gitlab_token:{len}]'

  - name: google_api_key
    description: "Google API keys (AIza…)"
    kind: credential
    regex: '\bAIza[0-9A-Za-z_\-]{35}\b'
    replacement: '[REDACTED:google_api_key:{len}]'

  - name: stripe_key
    description: "Stripe secret/restricted keys (live + test)"
    kind: credential
    regex: '\b[rs]k_(?:live|test)_[A-Za-z0-9]{24,99}\b'
    replacement: '[REDACTED:stripe_key:{len}]'

  - name: huggingface_token
    description: "Hugging Face access tokens"
    kind: credential
    regex: '\bhf_[A-Za-z0-9]{30,}\b'
    replacement: '[REDACTED:hf_token:{len}]'

  - name: npm_token
    description: "npm registry auth tokens (npm_xxx, 40 chars total)"
    kind: credential
    regex: '\bnpm_[A-Za-z0-9]{36}\b'
    replacement: '[REDACTED:npm_token:{len}]'

  - name: aws_access_key
    description: "AWS access key IDs (AKIA/ASIA/etc)"
    kind: credential
    regex: '\b(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b'
    replacement: '[REDACTED:aws_key:{len}]'

  - name: slack_token
    description: "Slack xoxa/b/p/r/s tokens"
    kind: credential
    regex: 'xox[abrsp]-[A-Za-z0-9-]{10,72}'
    replacement: '[REDACTED:slack_token:{len}]'

  - name: telegram_bot
    description: "Telegram bot tokens (bot_id:hash)"
    kind: credential
    regex: '\b\d{9,10}:[A-Za-z0-9_\-]{35}\b'
    replacement: '[REDACTED:telegram_bot:{len}]'

  - name: jwt
    description: "JSON Web Tokens (any audience)"
    kind: credential
    regex: 'eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9._+/=\-]+'
    replacement: '[REDACTED:jwt:{len}]'

  - name: private_key_pem
    description: "PEM-encoded private keys (RSA/EC/DSA/OPENSSH/PGP)"
    kind: credential
    # multiline; producer-side already uses (?s) flag
    regex: '-----BEGIN (?:RSA |OPENSSH |EC |DSA |PGP |ENCRYPTED )?PRIVATE KEY-----.+?-----END[^-]+-----'
    replacement: '[REDACTED:private_key:{len}]'

  - name: db_url
    description: "Connection URLs with embedded creds (pg/mysql/mongo)"
    kind: credential
    regex: '(?:postgres|mysql|mongodb)(?:\+srv)?://[^:\s]+:[^@\s]+@[^\s/]+'
    replacement: '[REDACTED:db_url:{len}]'

  - name: eth_private_key
    description: "Ethereum-style 32-byte hex private keys"
    kind: credential
    regex: '\b0x[a-fA-F0-9]{64}\b'
    replacement: '[REDACTED:eth_key:{len}]'

  - name: btc_address
    description: "Bitcoin segwit/taproot addresses"
    kind: pii
    regex: '\bbc1[a-z0-9]{39,59}\b'
    replacement: '[REDACTED:btc_addr:{len}]'

  # ----- PII -----
  - name: email
    description: "Email addresses"
    kind: pii
    regex: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    replacement: '[REDACTED:email:{len}]'

  # ----- environment leaks -----
  - name: user_path
    description: >-
      Home-directory prefix. Built DYNAMICALLY at runtime from the current
      user's home plus $ACTIVITY_MESH_REDACT_HOMES (colon-separated extra
      prefixes) — no hardcoded usernames in code or config.
    kind: env
    regex: '<dynamic: $HOME + $ACTIVITY_MESH_REDACT_HOMES>'
    replacement: '[REDACTED:user_path:{len}]'

  - name: lan_ip
    description: "RFC1918 private LAN IPs, all four octets (10/8, 192.168/16, 172.16/12)"
    kind: env
    regex: '\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'
    replacement: '[REDACTED:lan_ip:{len}]'

# Allowlist: regex matches that should NEVER be redacted, even if they look
# high-entropy. These are content addresses, not secrets.
allowlist:
  - name: uuid
    description: "Canonical UUIDs (36-char with dashes) are not secrets"
    regex: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'

  - name: git_sha
    description: "Git SHA-40 hex is content-addressed, not a secret"
    regex: '\b[0-9a-f]{40}\b'

  - name: sha256_hex
    description: "SHA-256 hex digests are content-addressed"
    regex: '\b[0-9a-f]{64}\b'

  - name: ulid
    description: "ULIDs (Crockford base32, 26 chars) are content-addressed"
    regex: '\b[0-9A-HJKMNP-TV-Z]{26}\b'
