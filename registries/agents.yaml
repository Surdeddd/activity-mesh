# activity-mesh — agent registry (EXAMPLE)
#
# This file ships as a generic example. The live, personalised copy lives in
# the sync dir (~/Sync/activity/agents.yaml); `refresh-caches` reads that copy
# first and falls back to this seed. Edit the sync copy for your own agents;
# keep this file generic so the public repo carries no private infrastructure.
#
# Each writer that emits events declares itself here. Used by:
#   - silence detector (per-agent expected-cadence threshold)
#   - dead-man heartbeat (which agents MUST emit)
#   - the L3 router agents-cache (alias → agent-intent matching)
#
# Status enum: active | deprecated | archived
#   active     — emits expected; missing-heartbeat alerts fire
#   deprecated — emits accepted, no alerts
#   archived   — emits not expected; permanent silence is not an incident
#
# `expected_silence: true` skips the agent in the silence detector.
# `aliases` create an agent intent in the L3 router when matched in prompt
# text (any language). `weak_aliases` only qualify an already-detected intent
# (e.g. a bare generic term that usually means the tool, not this agent).
schema_version: 1

agents:
  - id: assistant
    description: "Example interactive AI assistant"
    runtime: example
    host: host-a
    status: active
    expected_silence: false
    silence_threshold_hours: 6
    aliases: [assistant]

  - id: worker
    description: "Example background worker agent"
    runtime: example
    host: host-b
    status: active
    expected_silence: false
    silence_threshold_hours: 6
    aliases: [worker]

  - id: scheduler
    description: "Example scheduled-jobs agent"
    runtime: example
    host: host-b
    status: active
    expected_silence: false
    silence_threshold_hours: 12

  - id: indexer
    description: "Example indexing service"
    runtime: example
    host: host-a
    status: active
    expected_silence: false
    silence_threshold_hours: 12

  # The default CLI emitter label (`activity-log emit` uses agent=cli unless
  # $ACTIVITY_AGENT overrides). Keep it registered so silence/adoption checks
  # resolve it.
  - id: cli
    description: "Default activity-log CLI emitter"
    runtime: cli
    host: any
    status: active
    expected_silence: true

  # ----- archived example (permanently disabled) -----
  - id: retired-bot
    description: "Example archived agent — permanent silence is expected"
    runtime: example
    host: host-b
    status: archived
    archived_at: 2026-01-15
    expected_silence: true
    reason: "example of a decommissioned agent"
