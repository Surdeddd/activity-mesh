# activity-mesh — agent registry
#
# Each writer that emits events declares itself here. Used by:
#   - silence detector (per-agent expected-cadence threshold)
#   - dead-man heartbeat (which agents MUST emit a heartbeat)
#   - reader UIs (label resolution, host badges)
#
# Status enum: active | deprecated | archived
#   active     — emits expected, missing-heartbeat alerts fire
#   deprecated — emits accepted, no alerts
#   archived   — emits not expected; permanent silence is not an incident
#
# `expected_silence: true` means this agent is intentionally not emitting;
# the silence detector skips it. Use for paused / disabled agents.
schema_version: 1

agents:
  # ----- claude code instances -----
  - id: claude-mac
    description: "Claude Code on the MacBook (interactive)"
    runtime: claude-code
    host: macbook
    status: active
    expected_silence: false
    silence_threshold_hours: 6

  - id: claude-mini
    description: "Claude Code on the mac-mini (OpenClaw bots, 24/7)"
    runtime: claude-code
    host: mac-mini
    status: active
    expected_silence: false
    silence_threshold_hours: 2

